services:
  - type: web
    name: jai-kisan-vyapar
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard (or leave empty for browser-local mode)
      - key: EWB_MODE
        value: sandbox
